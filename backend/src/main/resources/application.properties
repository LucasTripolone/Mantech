spring.application.name=mantech

# ========================
# Base de datos PostgreSQL
# En Docker: sobreescrito por variables de entorno del docker-compose
# En local:  usa localhost:5432
# ========================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mantech_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ========================
# JPA / Hibernate
# ========================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ========================
# Flyway
# ========================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.encoding=UTF-8
spring.flyway.baseline-on-migrate=true

# ========================
# JWT
# ========================
jwt.secret=${JWT_SECRET:4d4a6f436e4c72576e5a7142764d466f4e6b6a304b65336b6f464a5259754d74}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ========================
# CORS
# Coma-separado. En prod: setear APP_CORS_ALLOWED_ORIGINS al dominio del frontend.
# ========================
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:*}

# ========================
# Datos semilla (DataSeeder).
# Sin valor por defecto a propósito: una contraseña escrita en el repositorio
# termina siendo la que corre en producción. Si no se define la variable, el
# seeder genera una al azar y la escribe en el log de arranque.
# ========================
app.seed.admin-password=${SEED_ADMIN_PASSWORD:}
app.seed.tech-password=${SEED_TECH_PASSWORD:}

# ========================
# Server
# Railway inyecta la variable PORT dinamicamente; en local cae a 8080.
# ========================
server.port=${PORT:8080}

# ========================
# IoT (sensores de campo)
# Umbrales de clasificación NORMAL / ALERTA / CRITICO por magnitud.
# Ajustables por planta sin tocar el código.
# ========================
app.iot.threshold.temperature.warning=${IOT_TEMP_WARNING:60}
app.iot.threshold.temperature.critical=${IOT_TEMP_CRITICAL:80}
app.iot.threshold.vibration.warning=${IOT_VIB_WARNING:0.5}
app.iot.threshold.vibration.critical=${IOT_VIB_CRITICAL:1.5}
app.iot.threshold.tilt.warning=${IOT_TILT_WARNING:5}
app.iot.threshold.tilt.critical=${IOT_TILT_CRITICAL:15}

# Días de lecturas crudas que se conservan (la limpieza corre cada hora).
app.iot.retention-days=${IOT_RETENTION_DAYS:3}

# Clave del dispositivo de prueba que crea el seeder. Vacía = se genera al azar.
app.seed.iot-device-key=${IOT_DEVICE_KEY:}
